name: Build API

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Guard – API project is present
        run: |
          test -f RaceDay.API_Part2/RaceDay.API_Part2.csproj \
            || { echo "::error file=RaceDay.API_Part2/RaceDay.API_Part2.csproj::API project is missing from the repository"; exit 1; }

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('RaceDay.API_Part2/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RaceDay.API_Part2/RaceDay.API_Part2.csproj

      - name: Build
        run: >
          dotnet build RaceDay.API_Part2/RaceDay.API_Part2.csproj
          --configuration Release
          --no-restore
          
