name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RaceDay.APItests_Part2/RaceDay.APItests_Part2.csproj

      - name: Build
        run: dotnet build RaceDay.APItests_Part2/RaceDay.APItests_Part2.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test RaceDay.APItests_Part2/RaceDay.APItests_Part2.csproj --configuration Release --no-build --verbosity normal
