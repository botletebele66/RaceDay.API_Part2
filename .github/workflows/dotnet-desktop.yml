name: .NET

on:
  push:
    branches:
      - main
      - master
      - RaceDay-API-Part2
      - RaceDay-MVC
      - part3-mvc

permissions:
  contents: read

jobs:
  dotnet:
    name: Restore, build and test (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore RaceDay.API_Part2.csproj
          dotnet restore RaceDay.MVC/RaceDay.MVC.csproj
          dotnet restore tests/RaceDay.APItests_Part2/RaceDay.APItests_Part2.csproj
          dotnet restore tests/RaceDay.Tests_Part3/RaceDay.Tests_Part3.csproj

      - name: Build
        run: |
          dotnet build RaceDay.API_Part2.csproj --configuration Release --no-restore
          dotnet build RaceDay.MVC/RaceDay.MVC.csproj --configuration Release --no-restore
          dotnet build tests/RaceDay.APItests_Part2/RaceDay.APItests_Part2.csproj --configuration Release --no-restore
          dotnet build tests/RaceDay.Tests_Part3/RaceDay.Tests_Part3.csproj --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test tests/RaceDay.APItests_Part2/RaceDay.APItests_Part2.csproj --configuration Release --no-build
          dotnet test tests/RaceDay.Tests_Part3/RaceDay.Tests_Part3.csproj --configuration Release --no-build